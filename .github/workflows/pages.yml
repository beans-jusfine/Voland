name: Deploy Voland to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vercel-production
  cancel-in-progress: true

env:
  EMSDK_VERSION: 6.0.9
  NODE_VERSION: 24
  PNPM_VERSION: 11

jobs:
  build-core:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Set up Ninja
        uses: seanmiddleditch/gha-setup-ninja@v6
      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ env.EMSDK_VERSION }}
      - name: Configure WebAssembly core
        run: cmake --preset web -DVOLAND_WEB_MEMORY_PAGES=24576 -DVOLAND_WEB_GUEST_RAM_MIB=512
      - name: Build WebAssembly core
        run: cmake --build --preset web
      - name: Upload WebAssembly core
        uses: actions/upload-artifact@v4
        with:
          name: switch-core-wasm
          path: |
            build/web/core/switch_core.js
            build/web/core/switch_core.wasm
          if-no-files-found: error

  deploy:
    needs: build-core
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform/web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: platform/web/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Download WebAssembly core
        uses: actions/download-artifact@v4
        with:
          name: switch-core-wasm
          path: platform/web/public/core
      - name: Build web frontend
        env:
          VOLAND_WEB_MEMORY_PAGES: 24576
        run: pnpm run build
      - name: Pull Vercel project settings
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          test -n "$VERCEL_TOKEN" || (echo "Missing GitHub secret VERCEL_TOKEN" && exit 1)
          test -n "$VERCEL_ORG_ID" || (echo "Missing GitHub secret VERCEL_ORG_ID" && exit 1)
          test -n "$VERCEL_PROJECT_ID" || (echo "Missing GitHub secret VERCEL_PROJECT_ID" && exit 1)
          npx --yes vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Build Vercel production output
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VOLAND_WEB_MEMORY_PAGES: 24576
        run: npx --yes vercel@latest build --prod --token="$VERCEL_TOKEN"
      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN"
