name: Deploy Voland to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  EMSDK_VERSION: 6.0.9
  NODE_VERSION: 24
  PNPM_VERSION: 11

jobs:
  build-core:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up Ninja
        uses: seanmiddleditch/gha-setup-ninja@v6

      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ env.EMSDK_VERSION }}

      - name: Configure WebAssembly core
        run: cmake --preset web

      - name: Build WebAssembly core
        run: cmake --build --preset web

      - name: Upload WebAssembly core
        uses: actions/upload-artifact@v4
        with:
          name: switch-core-wasm
          path: |
            build/web/core/switch_core.js
            build/web/core/switch_core.wasm
          if-no-files-found: error

  deploy:
    needs: build-core
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform/web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: platform/web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download WebAssembly core
        uses: actions/download-artifact@v4
        with:
          name: switch-core-wasm
          path: platform/web/public/core

      - name: Build web frontend
        run: pnpm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: platform/web/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
