name: Deploy Voland to Cloudflare Pages

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: true

env:
  EMSDK_VERSION: 6.0.9
  NODE_VERSION: 24
  PNPM_VERSION: 11
  CLOUDFLARE_PAGES_PROJECT: voland-1qn

jobs:
  build-core:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Set up Ninja
        uses: seanmiddleditch/gha-setup-ninja@v6
      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ env.EMSDK_VERSION }}
      - name: Configure WebAssembly core
        run: cmake --preset web -DVOLAND_WEB_MEMORY_PAGES=32768 -DVOLAND_WEB_GUEST_RAM_MIB=1024
      - name: Build WebAssembly core
        run: cmake --build --preset web
      - name: Upload WebAssembly core
        uses: actions/upload-artifact@v4
        with:
          name: switch-core-wasm
          path: |
            build/web/core/switch_core.js
            build/web/core/switch_core.wasm
          if-no-files-found: error

  deploy:
    needs: build-core
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: platform/web/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: platform/web
        run: pnpm install --frozen-lockfile
      - name: Download WebAssembly core
        uses: actions/download-artifact@v4
        with:
          name: switch-core-wasm
          path: platform/web/public/core
      - name: Build web frontend
        env:
          VOLAND_WEB_MEMORY_PAGES: 32768
        working-directory: platform/web
        run: pnpm run build
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing GitHub secret CLOUDFLARE_API_TOKEN" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing GitHub secret CLOUDFLARE_ACCOUNT_ID" && exit 1)
          npx --yes wrangler@4 pages deploy platform/web/dist --project-name="$CLOUDFLARE_PAGES_PROJECT" --branch=main
